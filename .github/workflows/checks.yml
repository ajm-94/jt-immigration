name: Checks

# Runs on every pull request and on main. A red check means the change must not be merged.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
